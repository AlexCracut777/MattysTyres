*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(55% 60% at 50% 38%,rgba(255,90,20,.4),transparent 70%),repeating-linear-gradient(115deg,#000 0 38px,#0d0706 38px 40px);color:var(--text);font:400 18px/1.6 var(--body);display:flex;flex-direction:column;min-height:100%;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

.row{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}

.btn.alt{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.btn:hover{filter:brightness(1.12)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.tread{height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 36px,#000 36px 48px)}
footer{text-align:center;padding:1rem;color:var(--muted);font-size:.9rem;background:#000}
footer a{color:var(--gold)}
